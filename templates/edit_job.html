{% extends "base.html" %}

{% block title %}Edit Job{% endblock %}

{% block content %}
<h2 class="mt-5">Edit Job</h2>
<form method="post" class="mt-4">
  <h5>Job Details</h5>
  <div class="mb-3">
    <label for="customer_id" class="form-label">Customer</label>
    <select class="form-select" id="customer_id" name="customer_id" required>
      {% for customer in customers %}
        <option value="{{ customer.id }}" {% if customer.id == job.customer_id %}selected{% endif %}>{{ customer.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label for="location" class="form-label">Location</label>
    <input type="text" class="form-control" id="location" name="location" value="{{ job.location }}" required>
  </div>
  <div class="mb-3">
    <label for="duration" class="form-label">Estimated Duration (minutes)</label>
    <input type="number" class="form-control" id="duration" name="duration" value="{{ job.duration }}" required>
  </div>
  <div class="mb-3">
    <label for="worker_id" class="form-label">Assign to Worker</label>
    <select class="form-select" id="worker_id" name="worker_id" required>
      {% for worker in workers %}
        <option value="{{ worker.id }}" {% if worker.id == job.worker_id %}selected{% endif %}>{{ worker.username }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label for="notes" class="form-label">Job Notes</label>
    <textarea class="form-control" id="notes" name="notes" rows="3">{{ job.notes or '' }}</textarea>
  </div>

  <hr>
  <h5>Scheduling</h5>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="scheduled_date" class="form-label">Date</label>
      <input type="date" class="form-control" id="scheduled_date" name="scheduled_date" value="{{ job.scheduled_date.strftime('%Y-%m-%d') if job.scheduled_date }}">
    </div>
    <div class="col-md-6 mb-3">
      <label for="scheduled_time" class="form-label">Time</label>
      <input type="time" class="form-control" id="scheduled_time" name="scheduled_time" value="{{ job.scheduled_time.strftime('%H:%M') if job.scheduled_time }}">
    </div>
  </div>
  <div class="mb-3">
    <label for="recurrence_rule" class="form-label">Recurrence</label>
    <select class="form-select" id="recurrence_rule" name="recurrence_rule">
      <option value="" {% if not job.recurrence_rule %}selected{% endif %}>None</option>
      <option value="weekly" {% if job.recurrence_rule == 'weekly' %}selected{% endif %}>Weekly</option>
      <option value="bi-weekly" {% if job.recurrence_rule == 'bi-weekly' %}selected{% endif %}>Bi-Weekly</option>
      <option value="monthly" {% if job.recurrence_rule == 'monthly' %}selected{% endif %}>Monthly</option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary">Update Job</button>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const customerSelect = document.getElementById('customer_id');
    const dateInput = document.getElementById('scheduled_date');
    const workerSelect = document.getElementById('worker_id');
    const currentWorkerId = '{{ job.worker_id }}';

    function fetchAvailableWorkers() {
        const customerId = customerSelect.value;
        const date = dateInput.value;

        if (customerId && date) {
            fetch(`/api/available_workers?customer_id=${customerId}&date=${date}`)
                .then(response => response.json())
                .then(data => {
                    workerSelect.innerHTML = '<option value="">Select a worker...</option>';

                    let isCurrentWorkerAvailable = false;
                    data.forEach(worker => {
                        if (worker.id == currentWorkerId) {
                            isCurrentWorkerAvailable = true;
                        }
                        const option = new Option(worker.username, worker.id);
                        workerSelect.add(option);
                    });

                    // If the original worker is still available, re-select them.
                    // Otherwise, add them to the list as "unavailable" but still selected.
                    if (isCurrentWorkerAvailable) {
                         workerSelect.value = currentWorkerId;
                    } else {
                         const originalWorkerOption = new Option(`{{ job.worker.username }} (Currently Unavailable)`, currentWorkerId);
                         workerSelect.add(originalWorkerOption);
                         workerSelect.value = currentWorkerId;
                    }
                })
                .catch(error => console.error('Error fetching workers:', error));
        }
    }

    customerSelect.addEventListener('change', fetchAvailableWorkers);
    dateInput.addEventListener('change', fetchAvailableWorkers);

    // Trigger on page load to populate for the current date
    fetchAvailableWorkers();
});
</script>
{% endblock %}
