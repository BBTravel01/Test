{% extends "base.html" %}

{% block title %}Create Job{% endblock %}

{% block content %}
<h2 class="mt-5">Create a New Job</h2>
<form method="post" class="mt-4">
  <h5>Job Details</h5>
  <div class="mb-3">
    <label for="customer_id" class="form-label">Customer</label>
    <select class="form-select" id="customer_id" name="customer_id" required>
      {% for customer in customers %}
        <option value="{{ customer.id }}">{{ customer.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label for="location" class="form-label">Location</label>
    <input type="text" class="form-control" id="location" name="location" required>
  </div>
  <div class="mb-3">
    <label for="duration" class="form-label">Estimated Duration (minutes)</label>
    <input type="number" class="form-control" id="duration" name="duration" required>
  </div>
  <div class="mb-3">
    <label for="worker_id" class="form-label">Assign to Worker</label>
    <select class="form-select" id="worker_id" name="worker_id" required>
      {% for worker in workers %}
        <option value="{{ worker.id }}">{{ worker.username }}</option>
      {% endfor %}
    </select>
  </div>

  <hr>
  <h5>Scheduling</h5>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="scheduled_date" class="form-label">Date</label>
      <input type="date" class="form-control" id="scheduled_date" name="scheduled_date">
    </div>
    <div class="col-md-6 mb-3">
      <label for="scheduled_time" class="form-label">Time</label>
      <input type="time" class="form-control" id="scheduled_time" name="scheduled_time">
    </div>
  </div>
  <div class="mb-3">
    <label for="recurrence_rule" class="form-label">Recurrence</label>
    <select class="form-select" id="recurrence_rule" name="recurrence_rule">
      <option value="">None</option>
      <option value="weekly">Weekly</option>
      <option value="bi-weekly">Bi-Weekly</option>
      <option value="monthly">Monthly</option>
    </select>
  </div>

  <div class="mb-3">
    <label for="notes" class="form-label">Job Notes</label>
    <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
  </div>

  <button type="submit" class="btn btn-primary">Create Job</button>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const customerSelect = document.getElementById('customer_id');
    const dateInput = document.getElementById('scheduled_date');
    const workerSelect = document.getElementById('worker_id');

    function fetchAvailableWorkers() {
        const customerId = customerSelect.value;
        const date = dateInput.value;

        if (customerId && date) {
            fetch(`/api/available_workers?customer_id=${customerId}&date=${date}`)
                .then(response => response.json())
                .then(data => {
                    // Clear existing options
                    workerSelect.innerHTML = '<option value="">Select a worker...</option>';

                    if (data.length > 0) {
                        data.forEach(worker => {
                            const option = new Option(worker.username, worker.id);
                            workerSelect.add(option);
                        });
                    } else {
                        const option = new Option('No workers available', '');
                        option.disabled = true;
                        workerSelect.add(option);
                    }
                })
                .catch(error => console.error('Error fetching workers:', error));
        }
    }

    customerSelect.addEventListener('change', fetchAvailableWorkers);
    dateInput.addEventListener('change', fetchAvailableWorkers);
});
</script>
{% endblock %}
