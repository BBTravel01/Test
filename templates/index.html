{% extends "base.html" %}

{% block title %}Welcome{% endblock %}

{% block content %}
<div class="p-5 mb-4 bg-light rounded-3 mt-5">
  <div class="container-fluid py-5">
    <h1 class="display-5 fw-bold">Welcome to the Scheduling Tool</h1>
    <p class="col-md-8 fs-4">Your one-stop solution for managing garden maintenance jobs and schedules.</p>
    <hr class="my-4">
    <p>Please register for an account or log in to continue.</p>
    <a href="{{ url_for('main.login') }}" class="btn btn-primary btn-lg">Login</a>
    <a href="{{ url_for('main.register') }}" class="btn btn-secondary btn-lg">Register</a>
  </div>
</div>
{% endblock %}
