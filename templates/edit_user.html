{% extends "base.html" %}

{% block title %}Edit User Address{% endblock %}

{% block content %}
<h2 class="mt-5">Edit Address for {{ user.username }}</h2>
<form method="post" class="mt-4">
  <div class="row">
    <div class="col-md-8 mb-3">
      <label for="street" class="form-label">Street</label>
      <input type="text" class="form-control" id="street" name="street" value="{{ user.street or '' }}">
    </div>
    <div class="col-md-4 mb-3">
      <label for="town" class="form-label">Town</label>
      <input type="text" class="form-control" id="town" name="town" value="{{ user.town or '' }}">
    </div>
  </div>
  <div class="mb-3">
    <label for="postcode" class="form-label">Postcode</label>
    <input type="text" class="form-control" id="postcode" name="postcode" value="{{ user.postcode or '' }}">
  </div>
  <button type="submit" class="btn btn-primary">Update Address</button>
  <a href="{{ url_for('main.staff') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
