{% extends "base.html" %}

{% block title %}Edit User Address{% endblock %}

{% block content %}
<h2 class="mt-5">Edit Address for {{ user.username }}</h2>
<form method="post" class="mt-4">
  <div class="row">
    <div class="col-md-8 mb-3">
      <label for="street" class="form-label">Street</label>
      <input type="text" class="form-control" id="street" name="street" value="{{ user.street or '' }}">
    </div>
    <div class="col-md-4 mb-3">
      <label for="town" class="form-label">Town</label>
      <input type="text" class="form-control" id="town" name="town" value="{{ user.town or '' }}">
    </div>
  </div>
  <div class="mb-3">
    <label for="postcode" class="form-label">Postcode</label>
    <input type="text" class="form-control" id="postcode" name="postcode" value="{{ user.postcode or '' }}">
  </div>
  <hr>
  <h5>Availability</h5>
    <div class="mb-3">
        <label for="contracted_hours" class="form-label">Contracted Weekly Hours</label>
        <input type="number" class="form-control" id="contracted_hours" name="contracted_hours" value="{{ user.contracted_hours or '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Work Days</label>
        <div>
            {% set work_days = user.work_days.split(',') if user.work_days else [] %}
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="work_days" value="Mon" id="Mon" {% if 'Mon' in work_days %}checked{% endif %}>
                <label class="form-check-label" for="Mon">Mon</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="work_days" value="Tue" id="Tue" {% if 'Tue' in work_days %}checked{% endif %}>
                <label class="form-check-label" for="Tue">Tue</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="work_days" value="Wed" id="Wed" {% if 'Wed' in work_days %}checked{% endif %}>
                <label class="form-check-label" for="Wed">Wed</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="work_days" value="Thu" id="Thu" {% if 'Thu' in work_days %}checked{% endif %}>
                <label class="form-check-label" for="Thu">Thu</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="work_days" value="Fri" id="Fri" {% if 'Fri' in work_days %}checked{% endif %}>
                <label class="form-check-label" for="Fri">Fri</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="work_days" value="Sat" id="Sat" {% if 'Sat' in work_days %}checked{% endif %}>
                <label class="form-check-label" for="Sat">Sat</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="work_days" value="Sun" id="Sun" {% if 'Sun' in work_days %}checked{% endif %}>
                <label class="form-check-label" for="Sun">Sun</label>
            </div>
        </div>
    </div>
  <button type="submit" class="btn btn-primary">Update Details</button>
  <a href="{{ url_for('main.staff') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
